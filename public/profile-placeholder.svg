  <path d="M124 84 L109 86" stroke="#4a1414" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 입 -->
  <path d="M93 116 Q100 121 107 116" fill="none" stroke="#9a4a3a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 귀 -->
